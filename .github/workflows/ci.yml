name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published advisories fail the build even without code changes
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      mobile: ${{ steps.diff.outputs.mobile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Scheduled and manual runs check everything
          if [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "push" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "mobile=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            files=$(git ls-files)
          else
            files=$(git diff --name-only "$BEFORE" HEAD)
          fi
          echo "$files"
          # Workflow changes re-run both projects
          echo "$files" | grep -qE '^(backend/|\.github/)' && b=true || b=false
          echo "$files" | grep -qE '^(mobile/|\.github/)' && m=true || m=false
          echo "backend=$b" >> "$GITHUB_OUTPUT"
          echo "mobile=$m" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend build and test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      # Testcontainers uses the runner's Docker to start Postgres
      - run: ./mvnw -B -ntp verify

  mobile:
    name: Mobile typecheck and lint
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint

  security:
    name: Security (known vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: corretto
          java-version: '25'
          cache: maven
      - name: Mobile (npm audit, fails on any finding)
        working-directory: mobile
        run: npm audit
      - name: Backend (resolve Maven dependencies)
        working-directory: backend
        run: ./mvnw -B -ntp -q dependency:list -DoutputFile="$RUNNER_TEMP/maven-deps.txt" -DappendOutput=false
      - name: Backend (check against OSV, fails on any finding)
        run: node .github/scripts/osv-check-maven.mjs "$RUNNER_TEMP/maven-deps.txt"

  # The single required status check for main. Skipped jobs count as passing,
  # failed or cancelled jobs fail it.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, backend, mobile, security]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A required job did not pass ($r)"; exit 1 ;; esac
          done
