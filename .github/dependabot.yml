version: 2
updates:
  # Mobile: only refresh the lockfile within the ranges in package.json.
  # Expo pins compatible ranges per SDK; SDK upgrades are done by hand with
  # `npx expo install --fix`, never by Dependabot.
  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 5
    groups:
      mobile-deps:
        patterns: ['*']
    labels: [mobile, security]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    labels: [backend, security]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    labels: [ci]
