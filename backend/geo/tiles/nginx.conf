# Map gateway for local development on port 3000 (see ../README.md): one address for
# everything the map style loads, so the app needs nothing from third parties.
#   /basemap, /basemap/{z}/{x}/{y}    TileJSON and vector tiles (Martin)
#   /font/{fontstack}/{range}         glyphs (static PBF files, Protomaps basemaps-assets)
#   /sprite/basemap-dark[@2x].json|png  sprite sheet (static, Protomaps dark flavour)
# Martin can only build glyphs from TTF/OTF fonts and sprites from SVG folders; Protomaps
# publishes ready-made glyphs and sprites, so those are served as static files. The paths
# follow Martin's URL pattern, so the app's style does not change if Martin serves them later.
server {
	listen 3000;
	server_name _;

	# No access log: tile requests show which areas riders look at
	access_log off;

	root /data/assets;

	location ~ "^/font/(?<fontstack>[^/]+)/(?<range>[0-9]+-[0-9]+)$" {
		default_type application/x-protobuf;
		try_files "/fonts/$fontstack/$range.pbf" =404;
	}

	location ~ "^/sprite/basemap-dark(?<variant>(@2x)?\.(json|png))$" {
		try_files "/sprites/dark$variant" =404;
	}

	location / {
		proxy_pass http://martin:3000;
		# Martin builds the tile URLs in TileJSON from the Host header
		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
