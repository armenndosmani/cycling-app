spring.application.name=backend
spring.jpa.open-in-view=false

# Only the health endpoint is exposed over HTTP; it reports UP/DOWN without details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# API docs and Swagger UI are off by default and enabled only in the dev profile
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# No generated default user or password: there is no login until it is specified
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Hibernate never changes the schema; Flyway migrations do
spring.jpa.hibernate.ddl-auto=validate

# Version of the terms of use and privacy notice new accounts must accept
app.terms.version=draft-1

# Required outside dev and tests, the app does not start without them:
#   app.auth.jwt-secret (APP_AUTH_JWT_SECRET): at least 32 bytes, e.g. openssl rand -base64 48
#   app.mail.from (APP_MAIL_FROM): sender address of sign-in emails
#   spring.mail.host, spring.mail.port, spring.mail.username, spring.mail.password
#   (SPRING_MAIL_HOST, ...): SMTP server (Mailjet in production)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Self-hosted routing (GraphHopper) and place search (Photon). The defaults match the local
# geo stack (backend/geo/README.md); set APP_GEO_GRAPHHOPPER_URL and APP_GEO_PHOTON_URL
# elsewhere.
app.geo.graphhopper-url=http://localhost:8989
app.geo.photon-url=http://localhost:2322
app.geo.timeout=5s
