spring.application.name=backend
spring.jpa.open-in-view=false

# Only the health endpoint is exposed over HTTP; it reports UP/DOWN without details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# API docs and Swagger UI are off by default and enabled only in the dev profile
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# No generated default user or password: there is no login until it is specified
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
