# Local development: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Dev-only signing key for access tokens. Not a secret; never use it anywhere else
app.auth.jwt-secret=dev-only-not-a-secret-0123456789abcdef0123456789

# Emails go to Mailpit from compose.yaml (web UI: http://localhost:8025), never to a real inbox
app.mail.from=no-reply@localhost.test
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Devtools logs every handled exception, and some messages contain rejected values
# (coordinates, search terms, email addresses). Keep dev logs free of them too.
spring.mvc.log-resolved-exception=false
