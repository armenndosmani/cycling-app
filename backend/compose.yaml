# Local development only. Spring Boot starts the services without a profile automatically
# on bootRun (Postgres with PostGIS, Mailpit).
#
# The map stack (tiles, routing, place search) is heavy and needs downloaded data, so it is
# in the "geo" profile and never starts automatically. See geo/README.md:
#   ./geo/download-dev-data.sh
#   docker compose --profile geo up -d
services:
  postgres:
    image: 'postgis/postgis:18-3.7'
    environment:
      - 'POSTGRES_DB=cycling'
      - 'POSTGRES_USER=cycling'
      - 'POSTGRES_PASSWORD=local-dev-only'
    labels:
      # Not the official postgres image, so tell Spring Boot what it is
      org.springframework.boot.service-connection: postgres
    ports:
      - '127.0.0.1::5432'
  # Catches all emails in development: web UI at http://localhost:8025
  mailpit:
    image: 'axllent/mailpit:v1.33.1'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'

  # Vector map tiles (Protomaps basemap), only reachable through the map gateway below
  martin:
    profiles: [geo]
    image: 'ghcr.io/maplibre/martin:1.16.1'
    command: ['--listen-addresses', '0.0.0.0:3000', '/data/tiles/basemap.pmtiles']
    volumes:
      - './geo/data/tiles:/data/tiles:ro'
  # Map gateway at http://localhost:3000: tiles (from Martin), fonts and sprites
  # (geo/tiles/nginx.conf). To test on a physical phone on a trusted network, start with
  # GEO_MAP_BIND=0.0.0.0 so the phone can reach it.
  map:
    profiles: [geo]
    image: 'nginx:1.30.6-alpine'
    depends_on: [martin]
    volumes:
      - './geo/tiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
      - './geo/data/assets:/data/assets:ro'
    ports:
      - '${GEO_MAP_BIND:-127.0.0.1}:3000:3000'
  # Routing (profiles road, gravel, mtb, urban) at http://localhost:8989/route
  graphhopper:
    profiles: [geo]
    build: ./geo/graphhopper
    image: 'cycling-dev/graphhopper:11.1'
    environment:
      - 'JAVA_OPTS=-Xmx2g'
    volumes:
      - './geo/data:/data'
    ports:
      - '127.0.0.1:8989:8989'
  # Place search at http://localhost:2322/api?q=...
  photon:
    profiles: [geo]
    build: ./geo/photon
    image: 'cycling-dev/photon:1.3.0'
    environment:
      - 'JAVA_OPTS=-Xmx1g'
    volumes:
      - './geo/data/photon:/data/photon'
    ports:
      - '127.0.0.1:2322:2322'
