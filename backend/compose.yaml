# Local development only. Spring Boot starts this automatically on bootRun.
services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=cycling'
      - 'POSTGRES_USER=cycling'
      - 'POSTGRES_PASSWORD=local-dev-only'
    ports:
      - '5432'
  # Catches all emails in development: web UI at http://localhost:8025
  mailpit:
    image: 'axllent/mailpit:v1.33.1'
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
